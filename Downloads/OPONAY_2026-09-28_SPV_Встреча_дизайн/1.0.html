<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPONAY</title>
    <style>
      :root {
        --bg: #F5F7FA;
        --panel: #ffffff;
        --line: #E5EAF1;
        --text: #1A1A1A;
        --muted: #5A6472;
        --blue: #2E5AAC;
        --blue-soft: #EEF3FA;
      }
      * { box-sizing: border-box; }
      body {
        font-family: Inter, Arial, sans-serif;
        height: 100vh;
        background: var(--bg);
        margin: 0;
        padding: 14px;
        color: var(--text);
        overflow: hidden;
      }
      body > div { min-width: 0; }
      #dialogContainer, .side-window {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, .07);
        min-height: 0;
      }
      #dialogContainer {
        width: auto;
        padding: 18px;
        text-align: left;
        position: relative;
        height: calc(100vh - 28px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #dialogContainer h2 { margin: 0 0 12px; font-size: 19px; line-height: 1.25; }
      .side-window {
        padding: 18px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: calc(100vh - 28px);
        overflow: hidden;
      }
      .side-window h3 { margin:0 0 10px; font-size:18px; }

      .side-buttons {
        display: grid;
        grid-template-columns: 1fr;
        gap: 7px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .dialog-history {
        flex: 1;
        min-height: 120px;
        overflow-y: auto;
        margin-bottom: 10px;
        background-color: #f7f7f7;
        padding: 12px;
        border-radius: 10px;
      }
      .side-history {
        flex: 1;
        min-height: 120px;
        overflow-y: auto;
        margin-bottom: 10px;
        background-color: #f7f7f7;
        padding: 12px;
        border-radius: 10px;
      }
      .message {
        margin: 10px 0;
        padding: 10px;
        border-radius: 8px;
        background-color: #e9ecef;
        color: #333;
        text-align: left;
      }
      .response {
        margin: 10px 0;
        padding: 10px;
        border-radius: 8px;
        background-color: #cfe2ff;
        color: #084298;
        text-align: right;
      }
      .option, .side-option {
        display: block;
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        background-color: var(--blue);
        color: white;
        border: none;
        border-radius: 9px;
        cursor: pointer;
        transition: transform .12s ease, background-color .2s ease;
        margin: 0;
        font-weight: 700;
        text-align: left;
      }
      .option:hover, .side-option:hover { transform: translateY(-1px); }

      .nav-buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
        flex-shrink: 0;
      }
      .nav-button {
        padding: 10px 20px;
        background-color: #6c757d;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      .nav-sidebutton.back,
      .nav-sidebutton.start {
        padding: 10px 20px;
        background-color: #6c757d;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s;
      }

      .nav-sidebutton:hover {
        background-color: #138496;
      }
      .nav-sidebutton.start:hover {
        background-color: #218838;
      }
      .nav-button.back {
        background-color: #17a2b8;
      }
      .nav-button.start {
        background-color: #28a745;
      }
      .nav-button.back:hover {
        background-color: #138496;
      }
      .nav-button.start:hover {
        background-color: #218838;
      }
      body {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(260px, .82fr) minmax(260px, .82fr);
        gap: 14px;
      }
      @media (max-width: 1050px) {
        body { grid-template-columns: minmax(0, 1.2fr) minmax(230px, .9fr) minmax(230px, .9fr); gap:10px; padding:10px; }
        #dialogContainer, .side-window { height:calc(100vh - 20px); }
        #dialogContainer { padding:14px; }
        .side-window { padding:14px; }
      }
      @media (max-width: 760px) {
        body { display:block; overflow:auto; padding:8px; }
        #dialogContainer, .side-window { height:auto; min-height:0; margin-bottom:10px; }
        #dialogContainer { min-height:calc(100vh - 16px); }
        .dialog-history, .side-history { max-height:38vh; min-height:120px; flex:none; }
        .side-window { min-height:360px; }
      }

      @media (max-width: 900px) {
        body {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
          overflow: auto;
        }
        #dialogContainer, .side-window {
          height: auto;
          min-height: 520px;
        }
      }
      @media (max-width: 600px) {
        body { padding: 8px; gap: 8px; }
        #dialogContainer, .side-window { min-height: 460px; padding: 14px; }
        #dialogContainer h2 { font-size: 18px; }
        .option, .side-option { min-height: 46px; font-size: 14px; }
      }
    
      .call-top{grid-column:1/-1;height:42px;display:flex;align-items:center;gap:14px;padding:0 4px;color:var(--muted);font-size:13px}.call-top a{color:var(--blue);font-weight:800;text-decoration:none}.call-top strong{color:var(--blue);font-size:15px}.call-top span{color:var(--muted)}
      body{grid-template-rows:42px minmax(0,1fr)}
      @media(max-width:900px){body{grid-template-rows:auto;}.call-top{grid-column:auto}}
</style>
  <style id="oponay-blue-system">:root{--primary:#1F3A6E!important;--dark:#152A52!important;--accent:#2E5AAC!important;--background:#FFFFFF!important;--light:#F5F7FA!important;--text-primary:#1A1A1A!important;--text-secondary:#5A6472!important;--line:#E5EAF1!important;--shadow:0 4px 20px rgba(31,58,110,.08)!important}body{background:var(--background)!important;color:var(--text-primary)!important}header{background:#fff!important;color:var(--text-primary)!important;border-color:var(--line)!important;box-shadow:0 2px 14px rgba(31,58,110,.05)}nav a,.nav a{color:var(--text-secondary)!important}nav a:hover,.nav a:hover,nav a.active,.nav a.active{background:#EEF3FA!important;color:var(--primary)!important}.hero,.panel,.card,.lesson,.block,.box,section,details{border-color:var(--line)!important;box-shadow:var(--shadow)}h1,h2,h3,.logo{color:var(--primary)!important}p,li,small,.muted{color:var(--text-secondary)}button,.btn,.primary{border-radius:10px!important}.primary,button.primary{background:var(--primary)!important;color:#fff!important}.secondary{background:#fff!important;color:var(--primary)!important;border:2px solid var(--primary)!important}input,textarea,select{background:#F5F7FA!important;border-color:var(--line)!important;color:var(--text-primary)!important;border-radius:10px!important}details{background:#fff!important}summary{color:var(--text-primary)!important}.accent,.kicker,.eyebrow{color:var(--accent)!important}.section.light,section{background:#F5F7FA}.pill,.tag{background:#EEF3FA!important;color:var(--primary)!important}@media(max-width:700px){body{overflow-x:hidden}main{max-width:100%!important}.grid,.cards,.feature-grid{grid-template-columns:1fr!important}.nav,nav{overflow-x:auto;-webkit-overflow-scrolling:touch}.nav a,nav a{white-space:nowrap}.hero{padding:22px!important}h1{font-size:clamp(34px,9vw,48px)!important}h2{font-size:clamp(26px,7vw,36px)!important}}</style></head>

  <body>
    <div class="call-top"><a href="index.html">← Академия</a><strong>📞 Холодный звонок</strong><span>Рабочий скрипт 1.0</span></div>
    <div id="dialogContainer">
      <h2>Холодный звонок — рабочий скрипт OPONAY</h2>
        <div class="dialog-history" id="dialogHistory"></div>
      <div id="dialogOptions"></div>
      <div class="nav-buttons">
        <button class="nav-button back" onclick="goBack()">Назад</button>
        <button class="nav-button start" onclick="goToStart()">В начало</button>
      </div>
    </div>

    <div class="side-window">
      <h3>Возражения</h3>
      <div class="side-history" id="sideHistory1"></div>
      <div id="sideOptions1" class="side-buttons"></div>
      <div class="nav-buttons">
        <button class="nav-sidebutton back" onclick="side1GoBack()">Назад</button>
        <button class="nav-sidebutton start" onclick="side1GoToStart()">В начало</button>
      </div>
    </div>
    <div class="side-window">
      <h3>Вопросы и Инфа</h3>
      <div class="side-history" id="sideHistory2"></div>
      <div id="sideOptions2" class="side-buttons"></div>
      <div class="nav-buttons">
        <button class="nav-sidebutton back" onclick="side2GoBack()">Назад</button>
        <button class="nav-sidebutton start" onclick="side2GoToStart()">В начало</button>
      </div>
    </div>

    <script>
      const dialogTree = {
        greeting: {
          text: "Добрый день! Как поговорить с хозяином магазина?",
          options: [
            {
              text: "я и есть хозяин",
              nextNode: {
                text: "А как Вас зовут? Рада знакомству! Меня зовут _______, эксперт компании опонай. Звоню по поводу учета товаров и продаж в вашем магазине. Скажите, пожалуйста, как сейчас ведете учет и контролируете свой магазин.",
                options: [
                  {
                    text: "Эксель тетрадка",
                    nextNode: {
                      text: "Это уже хорошо! Однако этот метод не самый удобный, занимает много времени и велик риск воровства, а также человеческого фактора – забыли записать, потеряли тетрадку или завис компьютер, и данные пропали! Кроме этого, вести клиентскую базу почти невозможно! Скажите, хотели бы вы держать под контролем свой бизнес и увеличить свой доход?",
                      options: [
                        {
                          text: "Да",
                          nextNode: {
                            text: "Давайте расскажу, как это можно делать с помощью автоматизации. Мы разработали программу специально для бутиков одежды. Для того чтобы рассказать о нужных функциях, мне нужно задать вопросы касаемо того, как сейчас у вас обстоят дела.",
                            options: [],
                          },
                        },
                        {
                          text: "Нет",
                          nextNode: null,
                        },
                      ],
                    },
                  },
                  {
                    text: "Никак не ведем",
                    nextNode: {
                      text: "Значит я позвонил вовремя. Сейчас самое время рассматривать варианты автоматизации. Коротко расскажу: мы ставим специальное оборудование и программу для учета ваших продаж. Это поможет видеть прибыльность магазина, эффективность работы сотрудников, вести клиентскую базу и понимать, какие товары приносят доход, а какие залежались. Скажите, хотели бы вы держать под контролем свой бизнес и увеличить свой доход?",
                      options: [
                        {
                          text: "Да",
                          nextNode: {
                            text: "Давайте расскажу, как это можно делать с помощью автоматизации. Мы разработали программу специально для бутиков одежды. Для того чтобы рассказать о нужных функциях, мне нужно задать вопросы касаемо того, как сейчас у вас обстоят дела.",
                            options: [],
                          },
                        },
                        {
                          text: "Нет",
                          nextNode: null,
                        },
                      ],
                    },
                  },
                  {
                    text: "Вопросы клиента",
                    nextNode: {
                      text: "Смотри в окне 2 =) (Вопросы и Инфа)",
                      options: [],
                    },
                  },
                  {
                    text: "Возражения",
                    nextNode: {
                      text: "Смотри в окне 1 =) (Возражения)",
                      options: [],
                    },
                  },
                ],
              },
            },
            {
              text: "по какому вопросу?",
              nextNode: {
                text: "Я звоню по поводу установки кассового и антикражного оборудования в ваш магазин. Нужно назначить дату выезда техотдела. Только хозяин может мне подсказать. Продиктуйте номер, пожалуйста.",
                options: [
                  {
                    text: "а вы что-то нам будете ставить? Вы уже договорились с хозяином?",
                    nextNode: {
                      text: "Звоню как раз чтобы договориться о дате установки. Подскажите номер, пожалуйста.",
                      options: [],
                    },
                  },
                ],
              },
            },
            {
              text: "оставьте свой номер я передам",
              nextNode: {
                text: "Вопросы, которые нужно обсудить, важные, и мне нужно поговорить с владельцем сейчас, поэтому мне нужен номер. Сами понимаете, если вопросы о кассе - значит что-то важное. Продиктуйте номер, я записываю",
                options: [],
              },
            },
            {
              text: "у нас все есть кассовое оборудование",
              nextNode: {
                text: "Конечно у Вас есть, иначе зачем бы я Вам звонила. Вопросы такие: Какое? Что именно у вас стоит? Какие чеки отбиваете? Как и кто ведет отчетность? На эти и многие другие вопросы может ответить только директор. Продиктуйте номер, восемь .....",
                options: [],
              },
            },
            {
              text: "Кто вы и откуда звоните?",
              nextNode: {
                text: "Меня зовут ________! Я из компании, которая занимается кассовым оборудованием и отчётностью для собственника. Мне нужно назначить встречу с владельцем вашего и выбрать дату установки магазина, поэтому мне нужен номер, продиктуйте, пожалуйста.",
                options: [],
              },
            },
            {
              text: "отправьте на ватсап",
              nextNode: {
                text: "что отправить? Мне нужно задать вопросы владельцу по учету в вашем магазине. Какие чеки отбиваете? Как и кто ведет отчетность? На эти и многие другие вопросы может ответить только директор. Продиктуйте номер, восемь .....",
                options: [],
              },
            },
            {
              text: "(мягко) я не могу дать контакты, у нас запрещено",
              nextNode: {
                text: "Я прекрасно понимаю Вас, каждый день вам звонят что-то предлагают. Поэтому у вас это запрещено! Но я ничего не продаю и не предлагаю. Мне нужно понять, как у вас в заведении ведется отчетность и как работает кассовая зона. Не переживайте, ругать вас точно не будут. Сами понимаете раз вопрос о кассе - значит что-то важное! Продиктуйте, пожалуйста, номер.",
                options: [],
              },
            },
            {
              text: "(жестко) Я не дам вам номер!",
              nextNode: {
                text: "Хорошо! Вы готовы нести ответственность, если к вам придет проверка, а ваш магазин к ней не готов, только потому что вы не дали контакты, и мы не успели предупредить владельца? Скажите, как вас зовут и какую должность вы занимаете? Можно избежать всего этого, если я поговорю с владельцем! Продиктуйте, пожалуйста, номер!",
                options: [],
              },
            },
          ],
        },
        services: {
          text: "Выбе вопросрите",
          options: [
            { text: "1", nextNode: "serviceDetails" },
            { text: "Спасибо, не интересно", nextNode: null },
          ],
        },
        serviceDetails: {
          text: "Наши услуги включают ...",
          options: [],
        },
      };

      let currentNode = dialogTree.greeting;
      let historyStack = [];

      function displayOptions(node) {
        const dialogOptions = document.getElementById("dialogOptions");
        dialogOptions.innerHTML = "";
        if (!node.options || node.options.length === 0) {
          addMessage("Диалог завершён");
          return;
        }
        node.options.forEach((option) => {
          const optionButton = document.createElement("button");
          optionButton.className = "option";
          optionButton.innerText = option.text;
          optionButton.onclick = () => handleOptionClick(option);
          dialogOptions.appendChild(optionButton);
        });
      }

      function addMessage(text, isResponse = false) {
        const dialogHistory = document.getElementById("dialogHistory");
        const messageDiv = document.createElement("div");
        messageDiv.className = isResponse ? "response" : "message";
        messageDiv.innerText = text;
        dialogHistory.appendChild(messageDiv);
        dialogHistory.scrollTop = dialogHistory.scrollHeight;
      }

      function handleOptionClick(option) {
        addMessage(option.text, true);
        if (typeof option.nextNode === "string") {
          currentNode = dialogTree[option.nextNode];
        } else if (option.nextNode) {
          currentNode = option.nextNode;
        } else {
          addMessage("Диалог завершён");
          document.getElementById("dialogOptions").innerHTML = "";
          return;
        }
        historyStack.push(currentNode);
        addMessage(currentNode.text);
        displayOptions(currentNode);
      }

      function goBack() {
        if (historyStack.length > 1) {
          historyStack.pop();
          const prevNode = historyStack[historyStack.length - 1];

          const dialogHistory = document.getElementById("dialogHistory");
          dialogHistory.innerHTML = ""; // Очищаем историю

          addMessage(prevNode.text);
          displayOptions(prevNode);
        }
      }

      // Кнопка "Начало" для возврата в начало диалога
      async function goToStart() {
        currentNode = dialogTree.greeting;
        historyStack = [currentNode]; // Очищаем историю и добавляем начальный узел
        document.getElementById("dialogHistory").innerHTML = ""; // Очищаем историю диалога
        await addMessage(currentNode.text);
        await displayOptions(currentNode);
      }
      // Отдельные стеки истории для маленьких окон
      let side1HistoryStack = [];
      let side2HistoryStack = [];

      // Функции для окна 1 (Возражения)
      function side1AddMessage(text, buttons = []) {
        const sideHistory1 = document.getElementById("sideHistory1");
        const sideOptions1 = document.getElementById("sideOptions1");

        // Сохраняем текущее состояние в стек истории
        side1HistoryStack.push({ text, buttons });

        // Очищаем историю и кнопки
        sideHistory1.innerHTML = "";
        sideOptions1.innerHTML = "";

        // Добавляем сообщение
        const messageDiv = document.createElement("div");
        messageDiv.className = "message";
        messageDiv.innerText = text;
        sideHistory1.appendChild(messageDiv);

        // Добавляем кнопки
        if (buttons.length > 0) {
          buttons.forEach((button) => {
            const btn = document.createElement("button");
            btn.className = "side-option";
            btn.innerText = button.text;
            btn.onclick = button.action;
            sideOptions1.appendChild(btn);
          });
        }
      }

      function side1GoBack() {
        if (side1HistoryStack.length > 1) {
          side1HistoryStack.pop();
          const prevState = side1HistoryStack[side1HistoryStack.length - 1];
          const sideHistory = document.getElementById("sideHistory1");
          sideHistory.innerHTML = ""; // Очищаем историю
          side1AddMessage(prevState.text, prevState.buttons);
        }
      }

      function side1GoToStart() {
        if (side1HistoryStack.length > 0) {
          const startState = side1HistoryStack[0];
          side1HistoryStack = [startState];
          side1AddMessage(startState.text, startState.buttons);
        }
      }

      // Функции для окна 2 (Вопросы)
      function side2AddMessage(text, buttons = []) {
        const sideHistory2 = document.getElementById("sideHistory2");
        const sideOptions2 = document.getElementById("sideOptions2");

        side2HistoryStack.push({ text, buttons });

        sideHistory2.innerHTML = "";
        sideOptions2.innerHTML = "";

        const messageDiv = document.createElement("div");
        messageDiv.className = "message";
        messageDiv.innerText = text;
        sideHistory2.appendChild(messageDiv);

        buttons.forEach((button) => {
          const btn = document.createElement("button");
          btn.className = "side-option";
          btn.innerText = button.text;
          btn.onclick = button.action;
          sideOptions2.appendChild(btn);
        });
      }

      function side2GoBack() {
        if (side2HistoryStack.length > 1) {
          side2HistoryStack.pop();
          const prevState = side2HistoryStack[side2HistoryStack.length - 1];
          side2AddMessage(prevState.text, prevState.buttons);
        }
      }

      function side2GoToStart() {
        if (side2HistoryStack.length > 0) {
          const startState = side2HistoryStack[0];
          side2HistoryStack = [startState];
          side2AddMessage(startState.text, startState.buttons);
        }
      }

      side1AddMessage("Добро пожаловать в окно 2!", [
        {
          text: "Я все продажи вижу в каспи. У нас переводы.",
          action: () =>
            side1AddMessage(
              "Это понятно. Но каспи не покажет вам оборот и прибыльность, не сможет просчитать зарплату сотрудникам и не покажет какие товары уже заканчиваются. У нашей программы большой функционал как раз для вашего магазина. Именно поэтому я вам звоню и хочу встретиться.  Встреча для вас бесплатная, примерно 20 минут и на ней вы сможете понять как развивать свой магазин и как качественно вести учет. Когда вам будет удобно?"
            ),
        },
        {
          text: "у нас стоит,,,,,,,",
          action: () =>
            side1AddMessage("Я знаю эту программу", [
              {
                text: "Умаг",
                action: () =>
                  side1AddMessage("Выбери вариант ответа", [
                    {
                      text: "Если клиент продуктовый",

      function addSideMessage(windowNumber, text) {
        const sideHistory = document.getElementById(`sideHistory${windowNumber}`);
        sideHistory.innerHTML = ""; // Очищаем историю сообщений

        const messageDiv = document.createElement("div");
        messageDiv.className = "message";
        messageDiv.innerText = text;

        sideHistory.appendChild(messageDiv);
        sideHistory.scrollTop = sideHistory.scrollHeight;
      }

      function addSideButtons(windowNumber, buttons) {
        const sideOptions = document.getElementById(`sideOptions${windowNumber}`);
        sideOptions.innerHTML = ""; // Очищаем предыдущие кнопки

        buttons.forEach((button) => {
          const btn = document.createElement("button");
          btn.className = "side-option";
          btn.innerText = button.text;
          btn.onclick = button.action;
          sideOptions.appendChild(btn);
        });
      }

// Инициализация диалога
      async function startDialog() {
        currentNode = dialogTree.greeting;
        historyStack = [currentNode]; // Начальная история
        await addMessage(currentNode.text);
        await displayOptions(currentNode);
      }

      // Запуск диалога при загрузке
      startDialog();
